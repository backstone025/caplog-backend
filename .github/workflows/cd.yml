name: Caplog Prod Deploy CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Firebase Key 파일 자동 생성
      - name: Create Firebase Service Account JSON
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" > ./src/main/resources/firebase-service-account.json

      # 3. Java 21 및 빌드 환경 세팅
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 4. Gradle 빌드
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      # 5. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Docker 이미지 빌드 및 푸시
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/caplog-api:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/caplog-api:latest

      # 7. EC2 SSH 접속 및 Blue/Green 무중단 배포 진행
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/caplog

            # .env 파일 생성
            cat << EOF > .env
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            SPRING_PROFILES_ACTIVE=prod
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            TOKEN_PUBLIC_KEY=${{ secrets.TOKEN_PUBLIC_KEY }}
            TOKEN_PRIVATE_KEY=${{ secrets.TOKEN_PRIVATE_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            EOF

            # 공통 인프라(DB, Qdrant, Nginx) 최우선 구동
            docker compose up -d db qdrant nginx

            # 현재 실행 중인 백엔드 컨테이너 확인 (Blue vs Green)
            IS_BLUE=$(docker ps | grep caplog-api-blue || true)

            if [ -z "$IS_BLUE" ]; then
              TARGET_CURRENT="green"
              TARGET_UP="blue"
              TARGET_PORT="8080"
            else
              TARGET_CURRENT="blue"
              TARGET_UP="green"
              TARGET_PORT="8081"
            fi

            echo ">>> 배포 시작: caplog-api-${TARGET_UP}"

            # 최신 이미지 다운로드 및 타겟 컨테이너 실행
            docker compose pull caplog-api-${TARGET_UP}
            docker compose up -d caplog-api-${TARGET_UP}

            # Health Check (최대 60초 대기)
            echo ">>> Health Check 수행 중..."
            for i in {1..12}; do
              sleep 5
              REQUEST=$(curl -s http://localhost:${TARGET_PORT}/actuator/health || echo "DOWN")
              if [[ "$REQUEST" == *"UP"* ]]; then
                echo ">>> Health Check 성공!"
                break
              fi
              echo ">>> 대기 중... ($i/12)"
            done

            # Nginx 라우팅 스위칭
            echo "set \$service_url http://caplog-api-${TARGET_UP}:8080;" > ./nginx/service-url.inc
            docker exec nginx nginx -s reload

            # 구버전 컨테이너 종료 (이전 컨테이너가 존재할 경우만)
            if docker ps | grep -q "caplog-api-${TARGET_CURRENT}"; then
              echo ">>> 이전 버전(caplog-api-${TARGET_CURRENT}) 종료"
              docker compose stop caplog-api-${TARGET_CURRENT}
            fi

            # 불필요한 구형 이미지 정리
            docker image prune -f