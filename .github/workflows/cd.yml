name: CD

on:
  push:
    branches: [ main ]
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: 242777378795.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: caplog-api
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3
      - name: Java 17 세팅
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Gradle 빌드
        run: |
          chmod +x gradlew
          ./gradlew build -x test
      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: ECR 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 빌드 및 ECR Push
        run: |
          set -e
            
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
            
          echo "빌드할 이미지: ${IMAGE_URI}"
            
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

      - name: ECR 이미지 등록 확인
        run: |
          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag=latest \
            --region "${AWS_REGION}"

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
                  
            cd /home/ubuntu/caplog
                  
            git fetch origin
            git reset --hard origin/main
                  
            aws ecr get-login-password --region ap-northeast-2 \
              | docker login \
                --username AWS \
                --password-stdin \
                242777378795.dkr.ecr.ap-northeast-2.amazonaws.com
                  
            docker compose pull
            docker compose up -d
                  
            docker compose ps
            docker image prune -f
