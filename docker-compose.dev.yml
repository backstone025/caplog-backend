services:
  caplog-api:
    build: .
    container_name: caplog-api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # Profile 지정
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      # 로컬 DB 컨테이너(db:3306)로 연결
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect

      # Security & Token
      TOKEN_PUBLIC_KEY: ${TOKEN_PUBLIC_KEY}
      TOKEN_PRIVATE_KEY: ${TOKEN_PRIVATE_KEY}

      # AI & Vector DB
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}

      # AWS S3
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      qdrant:
        condition: service_healthy
      db:
        condition: service_healthy # DB가 완전히 구동 완료된 후 백엔드 실행
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: caplog-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Seoul
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck: # DB 가동 완료 체크
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333" # HTTP API 및 대시보드
      - "6334:6334" # gRPC (Spring AI 기본 통신 포트)
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck: # Qdrant 가동 완료 체크
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/service-url.inc:/etc/nginx/conf.d/service-url.inc
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - caplog-api-blue
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

# 로컬 DB 데이터 보존용 볼륨 선언
volumes:
  mysql_data: