spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080
  forward-headers-strategy: framework

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET_NAME}