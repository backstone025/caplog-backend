events { worker_connections 1024; }

http {
    include /etc/nginx/conf.d/service-url.inc;

    # 1. HTTP(80)로 들어오면 HTTPS(443)로 자동 강제 이동
    server {
        listen 80;
        server_name caplog.duckdns.org;
        return 301 https://$host$request_uri;
    }

    # 2. HTTPS(443) SSL 통신 및 백엔드 프록시 설정
    server {
        listen 443 ssl;
        server_name caplog.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/caplog.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/caplog.duckdns.org/privkey.pem;

        location / {
            proxy_pass $service_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}