events { worker_connections 1024; }

http {
    # Docker 내부 컨테이너 IP 해석용 DNS
    resolver 127.0.0.11 valid=30s;

    # HTTP(80) -> HTTPS(443) 강제 이동
    server {
        listen 80;
        server_name caplog.duckdns.org;
        return 301 https://$host$request_uri;
    }

    # HTTPS(443) SSL 및 프록시 설정
    server {
        listen 443 ssl;
        server_name caplog.duckdns.org;
        client_max_body_size 20M;

        # ★ include 경로 수정: /etc/nginx/service-url.inc
        include /etc/nginx/service-url.inc;

        ssl_certificate /etc/letsencrypt/live/caplog.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/caplog.duckdns.org/privkey.pem;

        location / {
            proxy_pass $service_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}